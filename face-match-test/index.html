<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>얼굴 궁합 테스트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>얼굴 궁합 테스트</h1>
    <p>두 사람의 얼굴 사진을 업로드하여 궁합을 확인해보세요!</p>
    <div class="container">
        <div class="upload-box">
            <h2>사용자 1</h2>
            <input type="file" id="imageUpload1" accept="image/*">
            <img id="image1" class="preview" src="#" alt="미리보기">
        </div>
        <div class="upload-box">
            <h2>사용자 2</h2>
            <input type="file" id="imageUpload2" accept="image/*">
            <img id="image2" class="preview" src="#" alt="미리보기">
        </div>
    </div>
    <button id="start-button">궁합 분석 시작</button>
    <div id="result-container">
        <h2>분석 결과</h2>
        <p id="loading-message" style="display: none;">얼굴을 분석하고 있습니다. 잠시만 기다려주세요...</p>
        <p id="result-text"></p>
        <canvas id="result-canvas"></canvas>
    </div>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="script.js"></script>
</body>
</html>
