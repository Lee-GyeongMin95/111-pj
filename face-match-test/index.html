<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>얼굴 궁합 테스트</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shared/common.css">
    <script defer src="shared/common.js"></script>
</head>
<body>
    <div id="home-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z">
         </path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </div>  
    <h1>얼굴 궁합 테스트</h1>
    <p>두 사람의 얼굴 사진을 업로드하여 궁합을 확인해보세요!</p>
    <div class="container">
        <div class="upload-box">
            <h2>사용자 1</h2>
            <input type="file" id="imageUpload1" accept="image/*">
            <img id="image1" class="preview" src="#" alt="미리보기">
            <canvas id="canvas1"></canvas>
        </div>
        <div class="upload-box">
            <h2>사용자 2</h2>
            <input type="file" id="imageUpload2" accept="image/*">
            <img id="image2" class="preview" src="#" alt="미리보기">
            <canvas id="canvas2"></canvas>
        </div>
    </div>
    <button id="start-button">궁합 분석 시작</button>
    <div id="result-container">
        <h2>분석 결과</h2>
        <p id="loading-message" style="display: none;">얼굴을 분석하고 있습니다. 잠시만 기다려주세요...</p>
        <p id="result-text"></p>
    </div>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="script.js"></script>
</body>
</html>
